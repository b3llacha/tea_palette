<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tea Palette by Bella Cha. A cabinet of consumer product design case studies, steeped in curiosity and refined with intention.">
  <meta name="theme-color" content="#f5f1e7">
  <title>Tea Palette | Refining Taste in Consumer Products: A Case Study Portfolio</title>

  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#cabinet">Skip to the tea collection</a>
  <header>
    <button class="brand" data-home aria-label="Tea Palette home"><span class="source-teacup" aria-hidden="true"></span><span>tea palette</span><span class="brand-star">✳</span></button>
    <span class="header-caption">REFINING TASTE IN CONSUMER PRODUCTS</span>
    <button class="about-link" id="about-button" aria-pressed="false">About Bella <span>↗</span></button>
  </header>
  <main>
    <section class="collection" aria-label="Tea cabinet case study collection">
      <div class="collection-heading"><p class="eyebrow">THE TEA CABINET</p><span>01 — 04</span></div>
      <div class="cabinet-stage">
        <span class="cabinet-note">a shelf full of fresh perspectives <span>↙</span></span>
        <div class="cabinet" id="cabinet" tabindex="-1">
          <div class="rack-crop"><img class="rack-source" src="assets/cabinet-reference.png" alt="Watercolor wooden tea cabinet with a blue vase, teapot, white cups, and glass jars"></div>
          <button class="vessel disney" data-case="disney" aria-label="Open Disney Plus case study" aria-pressed="false" aria-controls="detail-panel"><span class="vessel-label"><b>Disney+</b><small>02 · content discovery</small><i>↗</i></span></button>
          <button class="vessel beli" data-case="beli" aria-label="Open Beli case study" aria-pressed="false" aria-controls="detail-panel"><span class="vessel-label"><b>Beli</b><small>01 · discovery & ranking</small><i>↗</i></span></button>
          <button class="vessel duolingo" data-case="duolingo" aria-label="Open Duolingo case study" aria-pressed="false" aria-controls="detail-panel"><span class="vessel-label"><b>Duolingo</b><small>03 · onboarding & learning</small><i>↗</i></span></button>
          <button class="vessel trufru" data-case="trufru" aria-label="Open TruFru case study" aria-pressed="false" aria-controls="detail-panel"><span class="vessel-label"><b>TruFru</b><small>04 · brand & shopping</small><i>↗</i></span></button>
        </div>
        <p class="shelf-instruction">Choose a tea. Take a closer look.</p>
        <div class="street-sketch" role="img" aria-label="Hand-drawn London streetscape"></div>
      </div>
    </section>
    <aside class="detail-panel" id="detail-panel" aria-label="Portfolio introduction and case studies">
      <div class="panel-toolbar" hidden><button id="back-button">← The cabinet</button><div class="study-navigation"><button id="previous-button" aria-label="Previous case study">←</button><span id="case-counter"></span><button id="next-button" aria-label="Next case study">→</button></div></div>
      <div id="panel-content"></div>
    </aside>
  </main>
  <footer><div class="landscape-strip" aria-hidden="true"></div><span>Bella Cha <i>·</i> A case study portfolio</span><span class="footer-note">Thoughtfully brewed. Carefully refined.</span><span class="contact-note">LinkedIn · Email · Résumé <small>coming soon</small></span></footer>
  <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
